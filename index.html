<!DOCTYPE html>

  <title>Fragebogen/Dokument scannen</title>

  <style>
   @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');

  margin-top: 8px;

.scanner-card {
  flex: 1;
}

h1 {
  font-size: 34px;
  font-weight: 600;
  margin: 10px 0 15px;
}

.instruction {
  max-width: 600px;
  margin: 0 auto 35px;
  font-size: 20px;

  color: #536675;
}

#startButton {
  padding: 20px 38px;
  font-family: 'Montserrat', Arial, sans-serif;
  font-size: 22px;

  color: #ffffff;

  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#video {
  display: none;
  width: 100%;
  max-width: 650px;
  margin: 30px auto 0;
  border-radius: 12px;
}

#status {
  margin-top: 22px;
  font-size: 18px;
  color: #536675;
}

.footer {
  margin-top: 45px;
  padding-top: 22px;
  border-top: 1px solid #e4e9ec;
  font-size: 17px;
  font-weight: 500;
  color: #217b91;
}
    
.logo {
  width: 170px;
  max-width: 45%;
  height: auto;
  margin-bottom: 25px;
}

#stopButton {
  margin-top: 18px;
  padding: 14px 28px;
  font-family: 'Montserrat', Arial, sans-serif;
  font-size: 18px;
  font-weight: 500;
  background: #ffffff;
  color: #217b91;
  border: 2px solid #217b91;
  border-radius: 10px;
  cursor: pointer;
}
  </style>
  
</head>

<body>

<div class="container">

  <div class="brand">

    <img src="logo.png"
         alt="Priv.-Doz. Dr. Maximilian Pallauf"
         class="logo">

    <div class="doctor">
      Priv.-Doz. Dr. Maximilian Pallauf, FEBU
    </div>

    <div class="specialty">
      Urologie &amp; Andrologie
    </div>

  </div>

  <div class="scanner-card">

    <h1>Fragebögen und Dokumente scannen</h1>

    <p class="instruction">
      Bitte halten Sie den QR-Code vor die Kamera des Tablets.
    </p>

    <button id="startButton">
      QR-Code scannen
    </button>

   <button id="stopButton" style="display:none;">
   Kamera beenden
  </button>

    <video id="video" playsinline></video>

    <div id="status"></div>

  </div>

  <div class="footer">
    www.dein-urologe.at
  </div>

</div>

<script>

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const video = document.getElementById("video");
const status = document.getElementById("status");

let stream = null;


/* --------------------------------------------------
   Nur LATIDO-Adressen zulassen
-------------------------------------------------- */

function isAllowedLatidoUrl(value) {

  try {

    const url = new URL(value);

    if (url.protocol !== "https:") {
      return false;
    }

    const host = url.hostname.toLowerCase();

    return (
      host === "latido.at" ||
      host.endsWith(".latido.at") ||
      host === "latidoapp.at" ||
      host.endsWith(".latidoapp.at")
    );

  } catch (error) {

    return false;

  }

}


/* --------------------------------------------------
   Kamera / Scanner starten
-------------------------------------------------- */

startButton.addEventListener("click", async function () {

  status.textContent = "Kamera wird gestartet …";


  /* Prüfen, ob QR-Erkennung unterstützt wird */

  if (!("BarcodeDetector" in window)) {

    status.textContent =
      "Die QR-Code-Erkennung wird von diesem Browser noch nicht unterstützt.";

    return;

  }


  try {

    const supportedFormats =
      await BarcodeDetector.getSupportedFormats();

    if (!supportedFormats.includes("qr_code")) {

      status.textContent =
        "QR-Code-Erkennung wird auf diesem Gerät nicht unterstützt.";

      return;

    }


    /* Kamera öffnen */

    stream = await navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 640 },
    height: { ideal: 480 },
    frameRate: { ideal: 15, max: 30 }
  },
  audio: false
});

    video.srcObject = stream;

    video.style.display = "block";

    startButton.style.display = "none";

    await video.play();


    status.textContent =
      "QR-Code vor die Kamera halten …";


    const detector =
      new BarcodeDetector({
        formats: ["qr_code"]
      });


    /* --------------------------------------------------
       QR-Code laufend suchen
    -------------------------------------------------- */

    async function scan() {

      try {

        const codes =
          await detector.detect(video);


        if (codes.length > 0) {

          const value =
            codes[0].rawValue.trim();


          /* Nur LATIDO öffnen */

          if (isAllowedLatidoUrl(value)) {

            status.textContent =
              "Fragebogen wird geöffnet …";


            /* Kamera ausschalten */

            stream
              .getTracks()
              .forEach(track => track.stop());


            /*
              replace() statt href:
              Scanner-Seite wird nicht als normaler
              Zurück-Schritt im Verlauf behalten.
            */

            window.location.replace(value);

            return;

          }


          else {

            status.textContent =
              "Dieser QR-Code gehört nicht zu LATIDO.";

<script>

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const video = document.getElementById("video");
const status = document.getElementById("status");

let stream = null;
let scanning = false;
let scanTimer = null;


/* --------------------------------------------------
   Nur LATIDO-Adressen zulassen
-------------------------------------------------- */

function isAllowedLatidoUrl(value) {

  try {

    const url = new URL(value);

    if (url.protocol !== "https:") {
      return false;
    }

    const host = url.hostname.toLowerCase();

    return (
      host === "latido.at" ||
      host.endsWith(".latido.at") ||
      host === "latidoapp.at" ||
      host.endsWith(".latidoapp.at")
    );

  } catch (error) {

    return false;

  }

}


/* --------------------------------------------------
   Kamera vollständig beenden
-------------------------------------------------- */

function stopCamera() {

  scanning = false;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  if (stream) {

    stream.getTracks().forEach(track => {
      try {
        track.stop();
      } catch (e) {}
    });

    stream = null;
  }

  try {
    video.pause();
  } catch (e) {}

  video.srcObject = null;

  /* Oberfläche zurücksetzen */

  video.style.display = "none";
  stopButton.style.display = "none";
  startButton.style.display = "inline-block";
  startButton.disabled = false;

  status.textContent = "";
}


/* --------------------------------------------------
   Button: Kamera manuell beenden
-------------------------------------------------- */

stopButton.addEventListener("click", function () {
  stopCamera();
});


/* --------------------------------------------------
   Scanner-Oberfläche zurücksetzen
-------------------------------------------------- */

function resetScanner() {
  stopCamera();
}


/* --------------------------------------------------
   Beim Verlassen / Hintergrund Kamera freigeben
-------------------------------------------------- */

document.addEventListener("visibilitychange", () => {

  if (document.hidden) {
    stopCamera();
  }

});

window.addEventListener("pagehide", () => {
  stopCamera();
});


/* --------------------------------------------------
   Bei erneutem Anzeigen alles zurücksetzen
-------------------------------------------------- */

window.addEventListener("pageshow", () => {
  resetScanner();
});


/* --------------------------------------------------
   Kamera / Scanner starten
-------------------------------------------------- */

startButton.addEventListener("click", async function () {

  stopCamera();

  status.textContent = "Kamera wird gestartet …";
  startButton.disabled = true;


  if (!("BarcodeDetector" in window)) {

    status.textContent =
      "Die QR-Code-Erkennung wird von diesem Browser nicht unterstützt.";

    startButton.disabled = false;

    return;
  }


  try {

    /*
      Android kurz Zeit geben,
      einen eventuell alten Kamerastream freizugeben
    */

    await new Promise(resolve => setTimeout(resolve, 300));


    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: {
          ideal: "environment"
        }
      },

      audio: false

    });


    video.srcObject = stream;

    video.style.display = "block";

    startButton.style.display = "none";
    stopButton.style.display = "inline-block";

    startButton.disabled = false;


    await video.play();


    status.textContent =
      "QR-Code vor die Kamera halten …";


    const detector =
      new BarcodeDetector({
        formats: ["qr_code"]
      });


    scanning = true;


/* --------------------------------------------------
   QR-Code laufend suchen
-------------------------------------------------- */

    async function scan() {

      if (!scanning) {
        return;
      }


      try {

        if (video.readyState >= 2) {

          const codes =
            await detector.detect(video);


          if (codes.length > 0) {

            const value =
              codes[0].rawValue.trim();


            if (isAllowedLatidoUrl(value)) {

              status.textContent =
                "Fragebogen wird geöffnet …";


              /*
                Kamera vollständig beenden,
                bevor LATIDO geladen wird
              */

              stopCamera();


              /*
                Scannerseite nicht im Verlauf behalten
              */

              window.location.replace(value);

              return;

            }


            else {

              status.textContent =
                "Dieser QR-Code gehört nicht zu LATIDO.";

            }

          }

        }

      } catch (error) {

        console.log(error);

      }


      if (scanning) {

        scanTimer =
          setTimeout(scan, 300);

      }

    }


    scan();


  } catch (error) {

    console.log(error);

    stopCamera();

    status.textContent =
      "Die Kamera konnte nicht gestartet werden. Bitte erneut versuchen.";

  }

});

</script>

</body>
</html>
