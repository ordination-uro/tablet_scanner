<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Fragebogen/Dokument scannen</title>

  <style>
   @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');

body {
  margin: 0;
  min-height: 100vh;
  background: #ffffff;
  font-family: 'Montserrat', Arial, sans-serif;
  color: #16324a;
}

.container {
  min-height: 100vh;
  max-width: 900px;
  margin: 0 auto;
  padding: 55px 50px 35px;
  box-sizing: border-box;
  text-align: center;
  display: flex;
  flex-direction: column;
}

.brand {
  margin-bottom: 60px;
}

.doctor {
  font-size: 25px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.specialty {
  margin-top: 8px;
  font-size: 18px;
  font-weight: 400;
  color: #2799a5;
}

.scanner-card {
  flex: 1;
}

h1 {
  font-size: 34px;
  font-weight: 600;
  margin: 10px 0 15px;
}

.instruction {
  max-width: 600px;
  margin: 0 auto 35px;
  font-size: 20px;
  line-height: 1.55;
  color: #536675;
}

#startButton {
  padding: 20px 38px;
  font-family: 'Montserrat', Arial, sans-serif;
  font-size: 22px;
  font-weight: 600;
  color: #ffffff;
  background: #217b91;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#video {
  display: none;
  width: 100%;
  max-width: 650px;
  margin: 30px auto 0;
  border-radius: 12px;
}

#status {
  margin-top: 22px;
  font-size: 18px;
  color: #536675;
}

.footer {
  margin-top: 45px;
  padding-top: 22px;
  border-top: 1px solid #e4e9ec;
  font-size: 17px;
  font-weight: 500;
  color: #217b91;
}
    
.logo {
  width: 170px;
  max-width: 45%;
  height: auto;
  margin-bottom: 25px;
}
  </style>
  
</head>

<body>

<div class="container">

  <div class="brand">

    <img src="logo.png"
         alt="Priv.-Doz. Dr. Maximilian Pallauf"
         class="logo">

    <div class="doctor">
      Priv.-Doz. Dr. Maximilian Pallauf, FEBU
    </div>

    <div class="specialty">
      Urologie &amp; Andrologie
    </div>

  </div>

  <div class="scanner-card">

    <h1>Fragebögen und Dokumente scannen</h1>

    <p class="instruction">
      Bitte halten Sie den QR-Code vor die Kamera des Tablets.
    </p>

    <button id="startButton">
      QR-Code scannen
    </button>

    <video id="video" playsinline></video>

    <div id="status"></div>

  </div>

  <div class="footer">
    www.dein-urologe.at
  </div>

</div>

<script>

const startButton = document.getElementById("startButton");
const video = document.getElementById("video");
const status = document.getElementById("status");

let stream = null;


/* --------------------------------------------------
   Nur LATIDO-Adressen zulassen
-------------------------------------------------- */

function isAllowedLatidoUrl(value) {

  try {

    const url = new URL(value);

    if (url.protocol !== "https:") {
      return false;
    }

    const host = url.hostname.toLowerCase();

    return (
      host === "latido.at" ||
      host.endsWith(".latido.at") ||
      host === "latidoapp.at" ||
      host.endsWith(".latidoapp.at")
    );

  } catch (error) {

    return false;

  }

}


/* --------------------------------------------------
   Kamera / Scanner starten
-------------------------------------------------- */

startButton.addEventListener("click", async function () {

  status.textContent = "Kamera wird gestartet …";


  /* Prüfen, ob QR-Erkennung unterstützt wird */

  if (!("BarcodeDetector" in window)) {

    status.textContent =
      "Die QR-Code-Erkennung wird von diesem Browser noch nicht unterstützt.";

    return;

  }


  try {

    const supportedFormats =
      await BarcodeDetector.getSupportedFormats();

    if (!supportedFormats.includes("qr_code")) {

      status.textContent =
        "QR-Code-Erkennung wird auf diesem Gerät nicht unterstützt.";

      return;

    }


    /* Kamera öffnen */

    stream = await navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 640 },
    height: { ideal: 480 },
    frameRate: { ideal: 15, max: 30 }
  },
  audio: false
});

    video.srcObject = stream;

    video.style.display = "block";

    startButton.style.display = "none";

    await video.play();


    status.textContent =
      "QR-Code vor die Kamera halten …";


    const detector =
      new BarcodeDetector({
        formats: ["qr_code"]
      });


    /* --------------------------------------------------
       QR-Code laufend suchen
    -------------------------------------------------- */

    async function scan() {

      try {

        const codes =
          await detector.detect(video);


        if (codes.length > 0) {

          const value =
            codes[0].rawValue.trim();


          /* Nur LATIDO öffnen */

          if (isAllowedLatidoUrl(value)) {

            status.textContent =
              "Fragebogen wird geöffnet …";


            /* Kamera ausschalten */

            stream
              .getTracks()
              .forEach(track => track.stop());


            /*
              replace() statt href:
              Scanner-Seite wird nicht als normaler
              Zurück-Schritt im Verlauf behalten.
            */

            window.location.replace(value);

            return;

          }


          else {

            status.textContent =
              "Dieser QR-Code gehört nicht zu LATIDO.";

          }

        }

      } catch (error) {

        console.log(error);

      }


      setTimeout(scan, 250);

    }


    scan();


  } catch (error) {

    console.log(error);

    status.textContent =
      "Die Kamera konnte nicht geöffnet werden. Bitte Kameraberechtigung prüfen.";

  }

});

</script>

</body>
</html>
